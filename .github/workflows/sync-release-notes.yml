name: Sync release notes

on:
  push:
    branches: [main, feat/web-frontend]
    paths:
      - 'docs/releases/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Update GitHub releases from docs/releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in docs/releases/v*.md; do
            [ -e "$f" ] || continue
            tag="$(basename "$f" .md)"
            # tag 必须先存在（先推 tag，再推说明文件）
            if ! gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/$tag" >/dev/null 2>&1; then
              echo "skip $tag (no such tag)"
              continue
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$f"
              echo "updated $tag"
            else
              title="$tag"
              subject="$(sed -n '1s/^\*\*主题：\(.*\)\*\*$/\1/p' "$f")"
              if [ -n "$subject" ]; then title="$tag · $subject"; fi
              gh release create "$tag" --notes-file "$f" --title "$title" --verify-tag
              echo "created $tag"
            fi
            # 发布日期 = tag 指向 commit 的日期。补录的历史版本默认会是「今天」，排序也会乱。
            pub_date="$(git log -1 --format=%aI "refs/tags/$tag^{commit}" 2>/dev/null || true)"
            if [ -n "$pub_date" ]; then
              rel_id="$(gh release view "$tag" --json id --jq .id)"
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$rel_id" -f published_at="$pub_date" >/dev/null
              echo "  published_at -> $pub_date"
            fi
          done
