<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>乱斗三国 - Web</title>
    <!--
      美术素材署名（许可要求，务必保留）：
      - 图标 Icons made by Lorc, Delapouite, Skoll. Available on https://game-icons.net （CC BY 3.0）
      - 六角地块 Kenney （CC0，无需署名，鸣谢）
      依据 assets/art/ATTRIBUTION.md。建议后续加一个「关于/素材」入口做可见署名。
    -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <!--
      [离线可用 2026-10-04] 移除两处外网 CDN 依赖：
        · Google Fonts（Noto Sans SC）
        · cdnjs（Font Awesome 6.5.1）
      前者改由系统字体栈承接（macOS 走 PingFang SC，Windows 走 Microsoft YaHei）；
      后者改由 npm 依赖 @fortawesome/fontawesome-free 在 src/main.tsx 中引入。
      本项目定位「本地单机浏览器展示」，离线/内网/代理掉线时必须可用。
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #1a1a2e;
        color: #e8e0d0;
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
      /* 阶段A：标题/回合数用系统衬线栈——零体积换出「汉风」层级。
         阶段B 再替换为思源宋体（OFL）等 Web 字体。 */
      .font-serif {
        font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
      }
      /* 阶段A：尊重系统「减少动态效果」偏好——关掉脉冲/抖动/旋转。
         此前全项目无 prefers-reduced-motion 处理。 */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
      /* 阶段A：键盘可见焦点（此前无 :focus 样式，Tab 走查看不到焦点） */
      :focus-visible {
        outline: 2px solid #d4a84b;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
